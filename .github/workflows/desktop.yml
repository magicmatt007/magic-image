name: Desktop app (Windows)

# Builds the Windows app and publishes it as a GitHub Release (installer +
# portable exe) when a new version reaches main: bump the version in
# package.json (npm run bump -- X.Y.Z) and merge. The tag vX.Y.Z is created
# here, so nobody has to push tags. Pushing a v* tag by hand still works.
# Manual runs just build and attach the files to the workflow run.
on:
  push:
    branches: [main]
    paths: [package.json]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      # Signs the update files, so the installed app only accepts updates
      # built here (the matching public key is in tauri.conf.json).
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
    steps:
      - uses: actions/checkout@v4

      # release: publish a release for TAG. build: manual run, just build.
      # skip: package.json changed on main but the version already has a tag.
      - name: Decide what to do
        id: mode
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            echo "mode=build" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_type }}" = tag ]; then
            echo "mode=release" >> "$GITHUB_OUTPUT"
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            tag="v$(node -p "require('./package.json').version")"
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
              echo "$tag already exists, nothing to release."
              echo "mode=skip" >> "$GITHUB_OUTPUT"
            else
              echo "New version: releasing $tag"
              echo "mode=release" >> "$GITHUB_OUTPUT"
              echo "tag=$tag" >> "$GITHUB_OUTPUT"
            fi
          fi

      - if: steps.mode.outputs.mode != 'skip'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - if: steps.mode.outputs.mode != 'skip'
        uses: dtolnay/rust-toolchain@stable
      - if: steps.mode.outputs.mode != 'skip'
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - if: steps.mode.outputs.mode != 'skip'
        run: npm ci

      - name: Build and publish release
        if: steps.mode.outputs.mode == 'release'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ steps.mode.outputs.tag }}
          releaseName: magic-image ${{ steps.mode.outputs.tag }}
          releaseCommitish: ${{ github.sha }}
          releaseBody: |
            Windows desktop app. Saves over the original file and opens real folders, without browser restrictions.

            - **magic-image_*_x64-setup.exe**: installer for the current user (no admin rights needed).
            - **magic-image-portable.exe**: runs without installing (needs the WebView2 runtime, which Windows 11 includes).

            The app isn't code-signed, so Windows SmartScreen may warn on first start: choose "More info", then "Run anyway".

            The installed app (from version 0.7.0) checks for new versions itself and offers to install them in its status bar. The portable exe doesn't update itself.
          releaseDraft: false
          prerelease: false

      - name: Build (manual run)
        if: steps.mode.outputs.mode == 'build'
        run: npx tauri build

      - name: Add portable exe to the release
        if: steps.mode.outputs.mode == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp src-tauri/target/release/magic-image.exe magic-image-portable.exe
          gh release upload "${{ steps.mode.outputs.tag }}" magic-image-portable.exe --clobber

      - name: Keep build files (manual run)
        if: steps.mode.outputs.mode == 'build'
        uses: actions/upload-artifact@v4
        with:
          name: magic-image-windows
          path: |
            src-tauri/target/release/magic-image.exe
            src-tauri/target/release/bundle/nsis/*.exe
